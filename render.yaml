services:
  - type: web
    name: arctester-api
    runtime: docker
    dockerContext: .
    dockerfilePath: ./api/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SAME_SITE
        value: None
