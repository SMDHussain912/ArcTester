<!doctype html>
<html lang="en">
  <head>
    <style>
      html,body,#root{min-height:100%;margin:0}body{background:#f4f6fa}#boot-screen{position:fixed;inset:0;z-index:99999;display:grid;align-content:center;justify-items:center;gap:16px;background:#f4f6fa;color:#172033;font-family:Inter,ui-sans-serif,system-ui,sans-serif}#boot-screen .boot-mark{display:grid;place-items:center;width:68px;height:68px;border-radius:20px;background:#2563eb;color:white;font-size:36px;font-weight:900;box-shadow:0 14px 35px rgba(37,99,235,.24);animation:boot-pulse 1.5s ease-in-out infinite}#boot-screen .boot-brand{font-size:21px;font-weight:850;letter-spacing:-.6px}#boot-screen .boot-track{width:150px;height:4px;border-radius:9px;overflow:hidden;background:#dce5f4}#boot-screen .boot-track span{display:block;width:42%;height:100%;border-radius:9px;background:#2563eb;animation:boot-progress 1.1s ease-in-out infinite}#boot-screen p{margin:0;color:#748096;font-size:12px}@keyframes boot-pulse{50%{transform:scale(1.06);box-shadow:0 0 0 12px rgba(37,99,235,.08)}}@keyframes boot-progress{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}@media(prefers-reduced-motion:reduce){#boot-screen *{animation:none!important}}
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6fa" />
    <meta name="description" content="ArcTester — focused exam practice." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <title>ArcTester</title>
  </head>
  <body>
    <div id="boot-screen" role="status" aria-live="polite" aria-label="Loading ArcTester">
      <div class="boot-mark">A</div>
      <div class="boot-brand">ArcTester</div>
      <div class="boot-track"><span></span></div>
      <p>Preparing your workspace…</p>
    </div>
    <div id="root"></div>
    <script type="module">
      // Paint the standalone loading page first, animate it, then request the app bundle.
      // The React boot bridge removes this screen only after the app has committed a render.
      const bootStartedAt = performance.now();
      await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      await new Promise((resolve) => setTimeout(resolve, 1400));
      try {
        await import("/src/main.tsx");
      } catch (error) {
        console.error("ArcTester failed to load:", error);
        const status = document.querySelector("#boot-screen p");
        if (status) status.textContent = "ArcTester could not load. Check your connection and reload.";
        const track = document.querySelector("#boot-screen .boot-track");
        if (track) track.remove();
      }
    </script>
  </body>
</html>
