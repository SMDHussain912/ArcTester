<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6fa" />
    <meta name="description" content="ArcTester — focused exam practice." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/brand/aster-mark.svg?v=3" />
    <link rel="shortcut icon" type="image/svg+xml" href="/brand/aster-mark.svg?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=3" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=3" />
    <link rel="apple-touch-icon" href="/icon-192.png?v=3" />
    <title>ArcTester</title>
    <script>
      try {
        if (localStorage.getItem("arctester-theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", "#0d1320");
        }
      } catch {}
    </script>
    <style>
      html,body,#root{min-height:100%;margin:0}
      body{background:#f4f6fa}
      #boot-screen{position:fixed;inset:0;z-index:99999;display:grid;align-content:center;justify-items:center;gap:16px;background:#f4f6fa;color:#172033;font-family:Inter,ui-sans-serif,system-ui,sans-serif}
      #boot-screen .boot-mark{display:grid;place-items:center;width:68px;height:68px;border-radius:20px;background:transparent;box-shadow:none;animation:boot-pulse 1.5s ease-in-out infinite}
      #boot-screen .boot-mark svg{display:block;width:100%;height:100%}
      #boot-screen .boot-brand{font-size:21px;font-weight:850;letter-spacing:-.6px}
      #boot-screen .boot-track{width:150px;height:4px;border-radius:9px;overflow:hidden;background:#dce5f4}
      #boot-screen .boot-track span{display:block;width:42%;height:100%;border-radius:9px;background:#2563eb;animation:boot-progress 1.1s ease-in-out infinite}
      #boot-screen p{margin:0;color:#748096;font-size:12px}
      html[data-theme="dark"] body,html[data-theme="dark"] #root{background:#0d1320}
      html[data-theme="dark"] #boot-screen{background:#0d1320;color:#e8edf6}
      html[data-theme="dark"] #boot-screen p{color:#9aa8bd}
      html[data-theme="dark"] #boot-screen .boot-track{background:#273449}
      @keyframes boot-pulse{50%{transform:scale(1.04)}}
      @keyframes boot-progress{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}
      @media(prefers-reduced-motion:reduce){#boot-screen *{animation:none!important}}
    </style>
  </head>
  <body>
    <div id="boot-screen" role="status" aria-live="polite" aria-label="Loading ArcTester">
      <div class="boot-mark">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="ArcTester owl logo">
          <rect width="96" height="96" rx="25" fill="#3159D8"/>
          <path d="M18 39L13 18q-1-5 5-2l21 15M78 39l5-21q1-5-5-2L57 47" fill="#8FB1FF" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
          <path d="M18 47c0-22 13-35 30-35s30 13 30 35v20c0 14-13 22-30 22S18 81 18 67z" fill="#8FB1FF" stroke="#FFFFFF" stroke-width="3"/>
          <ellipse cx="35" cy="47" rx="14" ry="15" fill="#FFFFFF"/>
          <ellipse cx="61" cy="47" rx="14" ry="15" fill="#FFFFFF"/>
          <circle cx="39" cy="49" r="6" fill="#172033"/>
          <circle cx="57" cy="49" r="6" fill="#172033"/>
          <path d="M48 57l-8 9 8 5 8-5z" fill="#FBBF24" stroke="#D97706" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="boot-brand">ArcTester</div>
      <div class="boot-track"><span></span></div>
      <p>Preparing your workspace…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
