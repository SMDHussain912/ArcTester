name: ArcTester CI
# Run the full verification suite on consolidated development branches as well as main.

on:
  push:
    branches: [main, 'chatgpt/**']
  pull_request:
    branches: [main, 'chatgpt/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arctester-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arctester
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arctester"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arctester?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production dependency audit (high severity gate)
        run: npm audit --omit=dev --audit-level=high

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=api

      - name: Verify migrations on a clean PostgreSQL database
        run: npx prisma migrate deploy --schema=api/prisma/schema.prisma

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build web and API
        run: npm run build

  mobile:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install mobile dependencies
        run: npm install --prefix mobile

      - name: Typecheck mobile app
        run: npm run typecheck --prefix mobile

  dataset-preparation:
    name: TensorFlow dataset preparation tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test privacy-safe CSV conversion
        run: python -m unittest scripts/test_prepare_tensorflow_dataset.py -v

  sqlite-to-postgres-migration:
    name: SQLite to PostgreSQL migration utility tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arctester
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arctester"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arctester?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install migration helper dependency
        run: pip install -r requirements-migrate.txt

      - name: Test SQLite data migration helpers
        run: python -m unittest scripts/test_migrate_sqlite_to_postgres.py -v

  playwright-e2e:
    name: Playwright E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arctester
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arctester"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arctester?schema=public
      VITE_API_URL: http://localhost:4000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=api

      - name: Verify migrations
        run: npx prisma migrate deploy --schema=api/prisma/schema.prisma

      - name: Start API server
        run: npm run dev --workspace=api &
        sleep: 5

      - name: Run Playwright E2E tests
        run: npx playwright test --project=chromium
        working-directory: web
