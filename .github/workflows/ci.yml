name: ArcTester CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arctester-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Refresh npm lockfile for workspace dependency changes
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit npm lockfile changes
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "npm lockfile is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): sync npm lockfile"
          git push

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=api

      - name: Verify migrations on a clean SQLite database
        run: DATABASE_URL="file:./migration-check.db" npx prisma migrate deploy --schema=api/prisma/schema.prisma

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build web and API
        run: npm run build

  mobile:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install mobile dependencies
        run: npm install --prefix mobile

      - name: Typecheck mobile app
        run: npm run typecheck --prefix mobile
