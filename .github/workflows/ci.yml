name: ArcTester CI
# Run the full verification suite on consolidated development branches as well as main.

on:
  push:
    branches: [main, 'chatgpt/**']
  pull_request:
    branches: [main, 'chatgpt/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arctester-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arctester
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arctester"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arctester?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies and regenerate lockfile
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run production dependency audits (high severity gate)
        run: |
          # Audit each production workspace independently so workspace dev tools are not pulled into the production dependency tree.
          npm audit --workspace=api --omit=dev --audit-level=high
          npm audit --workspace=web --omit=dev --audit-level=high

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=api

      - name: Verify migrations on a clean PostgreSQL database
        run: npx prisma migrate deploy --schema=api/prisma/schema.prisma

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build web and API
        run: npm run build

      - name: Upload verified npm lockfile
        uses: actions/upload-artifact@v4
        with:
          name: verified-npm-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

  mobile:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install mobile dependencies
        run: npm install --prefix mobile

      - name: Typecheck mobile app
        run: npm run typecheck --prefix mobile

      - name: Run mobile unit tests
        run: npm test --prefix mobile

  sqlite-to-postgres-migration:
    name: SQLite to PostgreSQL migration utility tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arctester
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arctester"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arctester?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install migration helper dependency
        run: pip install -r requirements-migrate.txt

      - name: Test SQLite data migration helpers
        run: python -m unittest scripts/test_migrate_sqlite_to_postgres.py -v

  backup-restore-rehearsal:
    name: PostgreSQL backup/restore rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arctester
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arctester"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arctester
      RESTORE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arctester_rehearsal_ci
      PGPASSWORD: postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rehearse backup and restore using PostgreSQL 16 client tools
        env:
          BACKUP_FILE: ${{ runner.temp }}/arctester-rehearsal.dump
        run: |
          # The postgres:16 image supplies client tools matching the server.
          # Keep the backup on the runner and run the existing guarded script.
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            -e DATABASE_URL -e RESTORE_DATABASE_URL -e PGPASSWORD \
            -e BACKUP_FILE=/backup/arctester-rehearsal.dump \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$RUNNER_TEMP:/backup" \
            --workdir /workspace postgres:16 \
            bash -euo pipefail -c '
              createdb --maintenance-db="$DATABASE_URL" arctester_rehearsal_ci
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<SQL
          CREATE TABLE backup_rehearsal_probe (
            id integer PRIMARY KEY,
            payload text NOT NULL
          );
          INSERT INTO backup_rehearsal_probe (id, payload)
          VALUES (1, '\''restore-check-one'\''), (2, '\''restore-check-two'\'');
          SQL
              bash scripts/backup-restore-rehearsal.sh --execute
              restored="$(psql "$RESTORE_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM backup_rehearsal_probe WHERE payload LIKE '\''restore-check-%'\''")"
              test "$restored" = "2"
            '

  playwright-e2e:
    name: Playwright E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arctester
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arctester"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arctester?schema=public
      VITE_API_URL: http://localhost:4000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies and regenerate lockfile
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=api

      - name: Verify migrations
        run: npx prisma migrate deploy --schema=api/prisma/schema.prisma

      - name: Bootstrap isolated E2E administrator
        run: npm run admin:bootstrap --workspace=api
        env:
          BOOTSTRAP_ADMIN_EMAIL: admin@arctester.test
          BOOTSTRAP_ADMIN_PASSWORD: ArcTester-CI-Admin-2026!

      - name: Seed the question bank
        run: npm run prisma:seed --workspace=api

      - name: Approve isolated E2E fixture questions
        run: |
          npx prisma db execute --schema=api/prisma/schema.prisma --stdin <<'SQL'
          UPDATE "Question" SET "reviewStatus" = 'APPROVED';
          SQL

      - name: Start API server
        run: |
          npm run dev --workspace=api &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:4000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy within 60 seconds" >&2
          exit 1

      - name: Run Playwright E2E tests
        run: npx playwright test --project=chromium
        working-directory: web
