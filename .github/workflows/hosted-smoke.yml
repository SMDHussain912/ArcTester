name: ArcTester Hosted Smoke Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: arctester-hosted-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify deployed web and API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ARCTESTER_WEB_URL: ${{ vars.ARCTESTER_WEB_URL }}
      ARCTESTER_API_URL: ${{ vars.ARCTESTER_API_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment URLs are configured
        run: |
          test -n "$ARCTESTER_WEB_URL" || { echo "Set repository variable ARCTESTER_WEB_URL." >&2; exit 1; }
          test -n "$ARCTESTER_API_URL" || { echo "Set repository variable ARCTESTER_API_URL." >&2; exit 1; }

      - name: Run HTTPS hosted smoke checks
        run: bash scripts/hosted-smoke.sh
