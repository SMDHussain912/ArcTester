name: ArcTester Android Build

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "package.json"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - "package.json"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arctester-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release:
    name: Build Android installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Expo dependencies
        run: npm install --prefix mobile --no-audit --no-fund

      - name: Generate Android project
        run: npm run prebuild:android --prefix mobile

      - name: Validate Expo SDK dependency alignment
        working-directory: mobile
        run: npx expo install --check

      - name: Build standalone APK
        env:
          EXPO_PUBLIC_API_URL: https://example.invalid
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm run build:android:release --prefix mobile; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Android release build failed after 3 attempts." >&2
              exit 1
            fi
            echo "Gradle dependency/build attempt $attempt failed; retrying after a short delay." >&2
            sleep 15
          done

      - name: Generate APK checksum and build metadata
        shell: bash
        run: |
          apk="mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          sha256sum "$apk" > "${apk}.sha256"
          {
            echo "Commit: $GITHUB_SHA"
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Built at (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "APK size (bytes): $(stat -c %s "$apk")"
            echo "SHA-256: $(cut -d ' ' -f 1 "${apk}.sha256")"
          } > "${apk}.build-info.txt"
          {
            echo "### Android APK artifact"
            echo "- Size: $(stat -c %s "$apk") bytes"
            echo "- SHA-256: $(cut -d ' ' -f 1 "${apk}.sha256")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload standalone APK and verification metadata
        uses: actions/upload-artifact@v4
        with:
          name: arctester-android-apk
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/apk/release/app-release.apk.sha256
            mobile/android/app/build/outputs/apk/release/app-release.apk.build-info.txt
          if-no-files-found: error
          retention-days: 14
